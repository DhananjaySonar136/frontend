<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>Portfolio Details</h1>
        
    <fieldset>
        <legend>Personal Info</legend>

        <br>
        <label>Name :</label>
        <input type="text">

        <br><br>
        <label>Mobile no. :</label>
        <input type="number">
        
        <br><br>
        <label>Age :</label>
        <input type="number" min="0" max="100">
        
        <br><br>
        <label>Email :</label>
        <input type="email">
        
        <br><br>
        <label>Date of birth :</label>
        <input type="date">
        
        <br><br>
        <label>Gender :</label>
        <input type="radio" checked>Male
        <input type="radio">female
        
        <br><br>
        <label>Country :</label>
        <select>
            <option>India</option>
            <option>USA</option>
            <option>Tailand</option>
        </select>
    </fieldset>

<br>
    <fieldset>
        <legend>Profile Info</legend>
<br>
        <label>Year of experience :</label>
        <input type="number">

        <br><br>

        <label>Dev type :</label>
        <input type="checkbox">Frontend
        <input type="checkbox" checked>Backend

        <br><br>
        <label>Skill Level :</label>
        <input type="range">

        <br><br>
        <label>Upload file :</label>
        <input type="file">

    </fieldset>

    <br>
    <fieldset>
        <legend>Extra Curricular</legend>

        <br>
        <label>Hobbies</label>
        <input type="checkbox">Trading
        <input type="checkbox">Gaming
        <input type="checkbox">Sports

        <br><br>
        <label>Other Achievements</label>
        <textarea placeholder="Type here..."></textarea>
    </fieldset>
</body>
</html>
