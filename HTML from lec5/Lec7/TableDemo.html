<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <Table>
        <tr>
            <th>Item</th>

        </tr>

        <tr>

        <tr>

        </tr>

        </tr>

        <tr>

        <colgroup>
