<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>positioning</title>

    <!-- By default static positioning aaste -->
    <style>
        div{
            width: 100px;
            height: 100px;
        }
        
        .div1{
            position: static;
            background-color: aqua;
        }

        .div2{
            position: static;
            background-color: burlywood;
            left: 0;
        }
    </style>

</head>
<body>

    <div class="div1">
        <p>HP laptop</p>
    </div>

    <div class="div2">
        <p>Dell laptop</p>
    </div>
</body>
</html>
