<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute Positioning</title>


    <style>
        div{
            background-color: red;
            width: 100px;
            height: 100px;
            border: 5px solid black;        
        }

        .maindiv{
            margin: 100px auto;
            width: 500px;
            height: 500px;
        }

        .box1{
            position: absolute;
            top: 0;
            left: 0;
            background-color: aqua;
        }
        .box2{
            position: absolute;
            bottom: 0;
            right: 0;
            background-color: blueviolet;
        }
        .box3{
            position: absolute;
            right: 0;
            top:0;
            background-color: cadetblue;
        }
        .box4{
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: darkgreen;
        }
    </style>
</head>
<body>
    
    <div class="maindiv">
        <div  class="box1">
            <p>Nandurbar</p>
        </div>
        
        <div class="box2">
            <p>Pune</p>
        </div>
        
        <div class="box3">
            <p>Mumbai</p>
        </div>

        <div class="box4">
            <p>Chennai</p>
        </div>
    </div>

</body>

</html>
